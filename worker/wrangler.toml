name = "physistep-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Exact origins allowed to call the API (no path, no trailing slash). CI overrides this from the
# ALLOWED_ORIGINS repository variable. Change YOUR-GITHUB-USERNAME below if deploying by hand.
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USERNAME.github.io,http://localhost:5173"
GEMINI_MODELS = "gemini-flash-latest,gemini-flash-lite-latest"
RATE_LIMIT_PER_MIN = "10"

# Workers Logs (free): searchable structured logs in the Cloudflare dashboard; `npm run worker:dev` shows them locally.
[observability]
enabled = true

# The Gemini key is a SECRET, never put it here:  npx wrangler secret put GEMINI_API_KEY -c worker/wrangler.toml
